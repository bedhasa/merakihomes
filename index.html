<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meraki Homes Ethiopia — Luxury Home Services Platform</title>
    <script type="module">
      // AI Studio / sandbox compatibility: only enable this behavior in dev.
      if (import.meta.env.DEV) {
        (function () {
          try {
            var targetProps = ["fetch", "Request", "Response", "Headers"];
            targetProps.forEach(function (prop) {
              try {
                var desc =
                  Object.getOwnPropertyDescriptor(window, prop) ||
                  Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), prop);
                if (desc && desc.get && !desc.set) {
                  var currentVal = window[prop];
                  Object.defineProperty(window, prop, {
                    get: function () {
                      return currentVal;
                    },
                    set: function (val) {
                      currentVal = val;
                    },
                    configurable: true,
                    enumerable: true,
                  });
                }
              } catch (err) {}
            });
          } catch (e) {}
        })();
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
