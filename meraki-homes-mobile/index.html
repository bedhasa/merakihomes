    <script>
      (function() {
        // Ensure window.fetch has a setter so extensions and sandboxes can wrap/intercept it without throwing
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          try {
            var protoFetch = Window.prototype.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return protoFetch;
              },
              set: function(fn) {
                protoFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {}
        }

        // Suppress unhandled extension errors from breaking application runner
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('chrome-extension://') !== -1) {
            event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
